<meta name="theme-color" content="#1B1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body class="theme-nacht">
<div class="wrap">
  <header class="top">
    <button class="back" id="back" aria-label="Terug naar start">←</button>
    <div class="logo" id="logo">💜 <span id="appnaam">leren met BTS</span></div>
    <div class="tools">
      <button class="tool" id="smaller" aria-label="Tekst kleiner">A−</button>

      <button class="tool" id="space" aria-label="Meer ruimte tussen letters">↔</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div id="modal-body"></div>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>
